[project]
name = "wplace-auto-painter-pw"
version = "0.1.1"
description = "Some awesome description..."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "anyio>=4.11.0",
  "ayafileio>=1.4.4",
  "bot7685-ext==0.5.1",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "pillow>=12.0.0",
  "playwright==1.55.0",
  "pydantic>=2.12.3",
  "packaging>=25.0",
  "pyside6>=6.11.0",
  "pyside6-fluent-widgets>=1.11.2",
  "tzlocal>=5.3.1",
  "windows-toasts>=1.3.1 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "build" },
  { include-group = "test" },
]
lint = ["ruff>=0.16.5", "prek>=0.5.0", "ty>=0.0.78"]
build = ["pyinstaller>=6.16.0"]
test = ["pytest>=8.4.0"]

[tool.uv]
package = false

[tool.ty.analysis]
allowed-unresolved-imports = ["windows_toasts", "winrt.windows.ui.notifications"]
