[project]
name = "wplace-auto-painter-pw"
version = "0.2.5"
description = "Automated WPlace pixel painting with Playwright and a PySide6 GUI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "anyio>=4.15.1",
  "ayafileio>=1.8.0",
  "bot7685-ext==0.6.0",
  "httpx2>=2.13.1",
  "loguru>=0.7.3",
  "playwright==1.55.0",
  "pydantic>=2.13.5",
  "packaging>=26.3",
  "pyside6>=6.11.2",
  "pyside6-fluent-widgets>=1.11.3",
  "tzlocal>=5.4.4",
  "windows-toasts>=1.3.1 ; sys_platform == 'win32'",
  "lru-dict>=1.4.1",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "build" },
  { include-group = "test" },
  "poethepoet>=0.48.0",
]
lint = ["ruff>=0.16.10", "prek>=0.5.4", "ty>=0.0.84"]
build = ["pyinstaller>=6.22.3"]
test = ["pytest>=8.4.0"]

[tool.uv]
package = false

[tool.poe]
verbosity = -1

[tool.poe.tasks]
lint.parallel = [
  { cmd = "ruff check ." },
  { cmd = "ruff format --check ." },
  { cmd = "ty check --python-platform all ." },
]
lint.ignore_fail = "return_non_zero"
test.cmd = "python -m pytest -q tests"
check.sequence = ["lint", "test"]
build-updater.cmd = "pyinstaller --clean --noconfirm updater.spec"
build-app.cmd = "pyinstaller --clean --noconfirm build.spec"
build.sequence = ["check", "build-updater", "build-app"]
release.cmd = "python scripts/release.py"
