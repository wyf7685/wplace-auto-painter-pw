name: Build

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build.yml"
      - "build.spec"
      - "app/**"
      - "main.py"
      - "pyproject.toml"
      - "ruff.toml"
      - "uv.lock"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run basedpyright

  build:
    name: Build on ${{ matrix.platform.os }}
    needs: lint
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: linux
            runner: ubuntu-22.04
          - os: windows
            runner: windows-2022

    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true

      - name: Build
        env:
          BUILD_CI: "true"
          BUILD_ONEFILE: "true"
        run: |
          upx --version
          uv run pyinstaller build.spec

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wplace-auto-painter_${{ matrix.platform.os }}
          path: |
            dist/
